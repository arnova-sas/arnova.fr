name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# Supersede outdated runs of a pull request; push runs (head_ref empty) are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - name: Lint (Biome)
              run: yarn lint

            - name: Format check (Prettier)
              run: yarn prettier:check

            - name: Typecheck
              run: yarn typecheck

            - name: Check translation catalogue parity
              run: node scripts/check-messages.mjs

            - name: Check colour contrast (WCAG AA)
              run: node scripts/check-contrast.mjs

            - name: Build
              run: yarn build
