name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - name: Lint (Biome)
              run: yarn lint

            - name: Format check (Prettier)
              run: yarn prettier:check

            - name: Typecheck
              run: yarn typecheck

            - name: Check translation catalogue parity
              run: node scripts/check-messages.mjs

            - name: Build
              run: yarn build
